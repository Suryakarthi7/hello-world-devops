<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World v2 | Jenkins CI/CD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b, #4c1d95, #831843);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 45px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      max-width: 520px;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: #f472b6;
      font-size: 2.6rem;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.5);
    }
    p {
      color: #e2e8f0;
      font-size: 1.15rem;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 18px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ Hello World v2.0!</h1>
    <p>This update was automatically triggered and deployed via <strong>GitHub & Jenkins Poll SCM</strong> without clicking Build Now!</p>
    <div class="badge">🔥 100% Fully Automated CI/CD</div>
  </div>
</body>
</html>
