<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | Jenkins CI/CD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 500px;
    }
    h1 {
      color: #38bdf8;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #fff;
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hello World!</h1>
    <p>This application was automatically built, pushed to Docker Hub, and deployed via <strong>Jenkins CI/CD Pipeline</strong>!</p>
    <div class="badge">✅ 100% Automated Deployment</div>
  </div>
</body>
</html>
